name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '可选：期望标签；留空则从 AndroidManifest.xml 自动生成'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed APK and publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils jq
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "$GITHUB_ENV"

      - name: Resolve and validate release version
        id: release
        env:
          EXPECTED_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "${GITHUB_REPOSITORY}" != "yangyongyongyong/GeelyPassiveKey" ]; then
            echo "This workflow publishes the updater manifest for ${GITHUB_REPOSITORY}, but the App is pinned to yangyongyongyong/GeelyPassiveKey" >&2
            exit 1
          fi
          VERSION_NAME="$(xmllint --nonet --xpath \
            "string(/*[local-name()='manifest']/@*[local-name()='versionName'])" \
            GeelyKeyRadarApp/AndroidManifest.xml)"
          VERSION_CODE="$(xmllint --nonet --xpath \
            "string(/*[local-name()='manifest']/@*[local-name()='versionCode'])" \
            GeelyKeyRadarApp/AndroidManifest.xml)"
          if [[ ! "${VERSION_CODE}" =~ ^[0-9]+$ ]]; then
            echo "Invalid versionCode: ${VERSION_CODE}" >&2
            exit 1
          fi

          RELEASE_TAG="v${VERSION_NAME}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "${RELEASE_TAG}" ]; then
            echo "Pushed tag ${GITHUB_REF_NAME} does not match AndroidManifest version ${RELEASE_TAG}" >&2
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "branch" ] && [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Release must run from main or a matching tag; got branch ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          if [ -n "${EXPECTED_TAG}" ] && [ "${EXPECTED_TAG}" != "${RELEASE_TAG}" ]; then
            echo "Requested tag ${EXPECTED_TAG} does not match AndroidManifest version ${RELEASE_TAG}" >&2
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}" >/dev/null; then
            TAG_SHA="$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")"
            if [ "${TAG_SHA}" != "${GITHUB_SHA}" ]; then
              echo "Existing tag ${RELEASE_TAG} points to ${TAG_SHA}, not current commit ${GITHUB_SHA}" >&2
              exit 1
            fi
          fi

          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Version: ${RELEASE_TAG} (${VERSION_CODE}); matching tag will be created if absent"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "Missing repository secret ANDROID_KEYSTORE_BASE64" >&2
            exit 1
          fi
          KEYSTORE_PATH="${RUNNER_TEMP}/release.keystore"
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_PATH}"
          chmod 600 "${KEYSTORE_PATH}"
          echo "ANDROID_KEYSTORE=${KEYSTORE_PATH}" >> "$GITHUB_ENV"

      - name: Build signed APK
        id: build
        env:
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          SKIP_INSTALL: '1'
        run: |
          if [ -z "${ANDROID_KEYSTORE_PASS:-}" ]; then
            echo "Missing repository secret ANDROID_KEYSTORE_PASS" >&2
            exit 1
          fi
          if [ -z "${ANDROID_KEY_ALIAS:-}" ]; then
            echo "Missing repository secret ANDROID_KEY_ALIAS" >&2
            exit 1
          fi
          export BUILD_TOOLS="${ANDROID_SDK_ROOT}/build-tools/36.0.0"
          export ANDROID_JAR="${ANDROID_SDK_ROOT}/platforms/android-36/android.jar"
          APK="$(bash GeelyKeyRadarApp/build.sh --print-apk-path)"
          bash GeelyKeyRadarApp/build.sh
          test -f "${APK}"
          "${BUILD_TOOLS}/apksigner" verify --verbose --print-certs "${APK}" \
            | tee "${RUNNER_TEMP}/signature.txt"
          SIGNER="$(sed -n 's/^.*certificate SHA-256 digest: //p' "${RUNNER_TEMP}/signature.txt" \
            | head -1 | tr -d ':' | tr 'A-F' 'a-f')"
          EXPECTED="$(printf '%s' "${EXPECTED_CERT_SHA256:-}" | tr -d ':' | tr 'A-F' 'a-f')"
          if [ -n "${EXPECTED}" ] && [ "${SIGNER}" != "${EXPECTED}" ]; then
            echo "Signer mismatch: expected ${EXPECTED_CERT_SHA256}, got ${SIGNER}" >&2
            exit 1
          fi
          VERSION_NAME="$(xmllint --nonet --xpath \
            "string(/*[local-name()='manifest']/@*[local-name()='versionName'])" \
            GeelyKeyRadarApp/AndroidManifest.xml)"
          VERSION_CODE="$(xmllint --nonet --xpath \
            "string(/*[local-name()='manifest']/@*[local-name()='versionCode'])" \
            GeelyKeyRadarApp/AndroidManifest.xml)"
          RELEASE_DEFAULTS_MARKDOWN="${RUNNER_TEMP}/release-defaults.md"
          python3 - \
            GeelyKeyRadarApp/src/com/luca/geelykeyradar/PassiveKeyDefaults.java \
            "${RELEASE_DEFAULTS_MARKDOWN}" <<'PYTHON_DEFAULTS'
          import pathlib
          import re
          import sys

          source = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          destination = pathlib.Path(sys.argv[2])

          def number(name):
              match = re.search(
                  rf"\b{name}\s*=\s*([-+]?\d+(?:\.\d+)?)f\s*;", source
              )
              if match is None:
                  raise SystemExit(f"Missing float default: {name}")
              value = float(match.group(1))
              return f"{value:g}"

          def milliseconds(name):
              match = re.search(rf"\b{name}\s*=\s*(\d+)L\s*;", source)
              if match is None:
                  raise SystemExit(f"Missing long default: {name}")
              return int(match.group(1))

          connect = number("CONNECT_DBM")
          unlock = number("UNLOCK_DBM")
          lock = number("LOCK_DBM")
          dwell = milliseconds("LOCK_DWELL_MS") / 1000.0
          body = (
              "## 默认触发参数\n\n"
              f"- 蓝牙连接触发：≥ {connect} dBm\n"
              f"- 靠近解锁：≥ {unlock} dBm\n"
              f"- 离开上锁：≤ {lock} dBm\n"
              f"- 离开确认：{dwell:.1f} 秒\n\n"
              "> 以上为全新安装默认值；升级安装会保留用户已保存的配置。\n"
          )
          destination.write_text(body, encoding="utf-8")
          PYTHON_DEFAULTS
          test -s "${RELEASE_DEFAULTS_MARKDOWN}"
          grep -q "蓝牙连接触发" "${RELEASE_DEFAULTS_MARKDOWN}"
          grep -q "离开确认" "${RELEASE_DEFAULTS_MARKDOWN}"
          APK_NAME="$(basename "${APK}")"
          CHECKSUM="${RUNNER_TEMP}/${APK_NAME}.sha256"
          (cd "$(dirname "${APK}")" && sha256sum "${APK_NAME}") > "${CHECKSUM}"
          SHA256="$(sha256sum "${APK}" | awk '{print $1}')"
          APK_SIZE="$(stat -c '%s' "${APK}")"
          MAX_APK_BYTES=2097152
          if (( APK_SIZE > MAX_APK_BYTES )); then
            echo "APK too large: ${APK_SIZE} bytes exceeds ${MAX_APK_BYTES} bytes" >&2
            exit 1
          fi
          FORBIDDEN_PATTERN='(^|/)(docs?|reverse_engineering|decompiled)(/|$)|geely-jadx|\.(md|java)$'
          if unzip -Z1 "${APK}" | grep -Eiq "${FORBIDDEN_PATTERN}"; then
            echo "APK contains documentation or reverse-engineering content:" >&2
            unzip -Z1 "${APK}" | grep -Ei "${FORBIDDEN_PATTERN}" >&2 || true
            exit 1
          fi
          APK_SIZE_KIB="$((APK_SIZE / 1024))"
          MAX_APK_KIB="$((MAX_APK_BYTES / 1024))"
          RELEASE_HIGHLIGHTS_MARKDOWN="${RUNNER_TEMP}/release-highlights.md"
          HIGHLIGHTS_FILE=".github/release-notes/${RELEASE_TAG}.md"
          if [ -f "${HIGHLIGHTS_FILE}" ]; then
            cp "${HIGHLIGHTS_FILE}" "${RELEASE_HIGHLIGHTS_MARKDOWN}"
          else
            printf '### 本次更新\n\n- 详见下方自动生成的变更记录。\n' > "${RELEASE_HIGHLIGHTS_MARKDOWN}"
          fi
          test -s "${RELEASE_HIGHLIGHTS_MARKDOWN}"
          RELEASE_NOTES_MARKDOWN="${RUNNER_TEMP}/release-notes.md"
          {
            printf '## GeelyPassiveKey v%s（构建 %s）\n\n' "${VERSION_NAME}" "${VERSION_CODE}"
            cat "${RELEASE_HIGHLIGHTS_MARKDOWN}"
            printf '\n### 安装包\n\n'
            printf -- '- APK 仅包含 Android 运行时代码与资源，不包含 `docs/`、反编译资料、官方 App 原始 DEX、源码或源码归档。\n'
            printf -- '- APK 文件：`%s`\n' "${APK_NAME}"
            printf -- '- APK 大小：%s KiB（%s 字节），CI 上限 %s KiB。\n\n' "${APK_SIZE_KIB}" "${APK_SIZE}" "${MAX_APK_KIB}"
            cat "${RELEASE_DEFAULTS_MARKDOWN}"
          } > "${RELEASE_NOTES_MARKDOWN}"
          test -s "${RELEASE_NOTES_MARKDOWN}"
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${APK_NAME}"
          UPDATE_MANIFEST="${RUNNER_TEMP}/update.json"
          jq -n \
            --arg versionName "${VERSION_NAME}" \
            --argjson versionCode "${VERSION_CODE}" \
            --arg apkName "${APK_NAME}" \
            --arg apkUrl "${APK_URL}" \
            --arg sha256 "sha256:${SHA256}" \
            --argjson size "${APK_SIZE}" \
            '{versionName:$versionName,versionCode:$versionCode,apkName:$apkName,apkUrl:$apkUrl,sha256:$sha256,size:$size}' \
            > "${UPDATE_MANIFEST}"
          echo "apk=${APK}" >> "$GITHUB_OUTPUT"
          echo "checksum=${CHECKSUM}" >> "$GITHUB_OUTPUT"
          echo "update_manifest=${UPDATE_MANIFEST}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_size=${APK_SIZE}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"
          echo "signer=${SIGNER}" >> "$GITHUB_OUTPUT"
          echo "release_notes=${RELEASE_NOTES_MARKDOWN}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: GeelyPassiveKey v${{ steps.build.outputs.version }}
          body_path: ${{ steps.build.outputs.release_notes }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ steps.build.outputs.apk }}
            ${{ steps.build.outputs.checksum }}
            ${{ steps.build.outputs.update_manifest }}

      - name: Warm and verify Cloudflare update mirror
        env:
          APK_NAME: ${{ steps.build.outputs.apk_name }}
          VERSION_NAME: ${{ steps.build.outputs.version }}
          VERSION_CODE: ${{ steps.build.outputs.version_code }}
          EXPECTED_SHA256: ${{ steps.build.outputs.sha256 }}
        run: |
          MANIFEST_URL="https://geelyupdate.mq.lucadesign.uk/update.json?refresh=1"
          for attempt in 1 2 3 4 5; do
            if MANIFEST="$(curl -fsS --max-time 30 -A "GeelyPassiveKey-release/${VERSION_NAME}" "$MANIFEST_URL")"; then
              break
            fi
            sleep $((attempt * 5))
          done
          printf '%s\n' "$MANIFEST"
          test "$(jq -r '.versionName' <<<"$MANIFEST")" = "$VERSION_NAME"
          test "$(jq -r '.versionCode' <<<"$MANIFEST")" = "$VERSION_CODE"
          test "$(jq -r '.apkName' <<<"$MANIFEST")" = "$APK_NAME"
          MIRROR_URL="$(jq -r '.apkUrl' <<<"$MANIFEST")"
          test "$MIRROR_URL" = "https://geelyupdate.mq.lucadesign.uk/releases/${VERSION_NAME}/${APK_NAME}"
          curl -fsS --retry 3 --retry-delay 3 -A "GeelyPassiveKey-release/${VERSION_NAME}" "$MIRROR_URL" -o "${RUNNER_TEMP}/cloudflare-mirror.apk"
          ACTUAL_SHA256="$(sha256sum "${RUNNER_TEMP}/cloudflare-mirror.apk" | awk '{print $1}')"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
          echo "Cloudflare mirror verified: $MIRROR_URL"
